<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="55%" stop-color="#081827"/>
      <stop offset="100%" stop-color="#0B1F33"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00D9FF" flood-opacity="0.35"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00A8FF" stroke-opacity="0.06"/>
    </pattern>

  </defs>

  <!-- BACKGROUND -->

  <rect width="1200" height="380" fill="url(#bg)"/>

  <rect width="1200" height="380" fill="url(#grid)"/>

  <!-- CYBER GLOW -->

  <circle cx="1000" cy="190" r="260" fill="url(#glow)"/>

  <!-- TOP TERMINAL LINE -->

  <rect x="55" y="45" width="1090" height="1" fill="#00D9FF" opacity="0.35"/>

  <!-- TERMINAL -->

  <text x="70" y="82"
        font-family="monospace"
        font-size="16"
        fill="#00FF9C">
    user@mariano:~$
  </text>

  <text x="235" y="82"
        font-family="monospace"
        font-size="16"
        fill="#E6EDF3">
    ./secure-backend
  </text>

  <!-- CODE -->

  <text x="70" y="125"
        font-family="monospace"
        font-size="15"
        fill="#8B949E">
    user.authenticated = 
  </text>

  <text x="280" y="125"
        font-family="monospace"
        font-size="15"
        fill="#00FF9C">
    True;
  </text>

  <text x="70" y="150"
        font-family="monospace"
        font-size="15"
        fill="#8B949E">
    password_hash = 
  </text>

  <text x="225" y="150"
        font-family="monospace"
        font-size="15"
        fill="#00D9FF">
    bcrypt.hash(password);
  </text>

  <text x="70" y="175"
        font-family="monospace"
        font-size="15"
        fill="#8B949E">
    security = 
  </text>

  <text x="165" y="175"
        font-family="monospace"
        font-size="15"
        fill="#00D9FF">
    "enabled";
  </text>

  <!-- MAIN TITLE -->

  <text x="70" y="235"
        font-family="Arial, Helvetica, sans-serif"
        font-size="43"
        font-weight="700"
        fill="#E6EDF3">
    MARIANO CÁCERES
  </text>

  <text x="72" y="270"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        font-weight="600"
        fill="#00D9FF">
    BACKEND DEVELOPMENT
  </text>

  <text x="300" y="270"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        fill="#8B949E">
    •
  </text>

  <text x="325" y="270"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        font-weight="600"
        fill="#00D9FF">
    PYTHON
  </text>

  <text x="415" y="270"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        fill="#8B949E">
    •
  </text>

  <text x="440" y="270"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        font-weight="600"
        fill="#00D9FF">
    APPSEC
  </text>

  <!-- SECURITY BADGE -->

  <rect x="70" y="300" width="290" height="42"
        rx="5"
        fill="#0B1F33"
        stroke="#00A8FF"
        stroke-opacity="0.65"/>

  <circle cx="95" cy="321" r="7" fill="#00FF9C" filter="url(#shadow)"/>

  <text x="115" y="327"
        font-family="monospace"
        font-size="14"
        fill="#00FF9C">
    SECURITY STATUS: ACTIVE
  </text>

  <!-- LOCK -->

  <g transform="translate(930 105)" filter="url(#shadow)">

    <rect x="0" y="65"
          width="130"
          height="100"
          rx="12"
          fill="#081827"
          stroke="#00D9FF"
          stroke-width="3"/>

    <path d="M30 65 V38
             C30 2 100 2 100 38
             V65"
          fill="none"
          stroke="#00D9FF"
          stroke-width="10"
          stroke-linecap="round"/>

    <circle cx="65" cy="105" r="16"
            fill="none"
            stroke="#00FF9C"
            stroke-width="4"/>

    <line x1="65" y1="121"
          x2="65" y2="145"
          stroke="#00FF9C"
          stroke-width="5"
          stroke-linecap="round"/>

  </g>

  <!-- BOTTOM -->

  <rect x="55" y="355" width="1090" height="1"
        fill="#00D9FF"
        opacity="0.35"/>

  <text x="70" y="370"
        font-family="monospace"
        font-size="11"
        fill="#8B949E">
    PYTHON  |  FASTAPI  |  OWASP  |  API SECURITY  |  LINUX
  </text>

</svg>
